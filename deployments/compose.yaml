# Local development stack. From the repository root:
#   docker compose -f deployments/compose.yaml up --build        # postgres + api + worker
#   docker compose -f deployments/compose.yaml --profile test run --rm test
#   docker compose -f deployments/compose.yaml --profile tunnel up -d tunnel   # public HTTPS URL for the phone
#   docker compose -f deployments/compose.yaml --profile monitoring up -d prometheus
# Simulator (PRIMARY_SMS_PROVIDER=mock): http://localhost:8088/simulator
name: smsai

x-app-env: &app-env
  DATABASE_URL: postgres://smsai:smsai_dev_password@postgres:5432/smsai?sslmode=disable
  HTTP_ADDR: ":8080"
  # The mock gateway posts signed delivery receipts back to the API.
  MOCK_DLR_CALLBACK_URL: http://api:8080/webhooks/sms/mock/status

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smsai
      POSTGRES_PASSWORD: smsai_dev_password
      POSTGRES_DB: smsai
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsai -d smsai"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    image: smsai-ghana:dev
    command: ["node", "--enable-source-maps", "dist/api.js"]
    env_file:
      - path: ../.env
        required: false
    environment: *app-env
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: smsai-ghana:dev
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    env_file:
      - path: ../.env
        required: false
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # Cloudflare quick tunnel: prints a public https://….trycloudflare.com URL
  # for the API (`docker compose ... logs tunnel`). Put it in GATEWAY_PUBLIC_URL
  # and pair the phone with `admin gateway-pair`. A quick tunnel's URL changes
  # on every start; use a named tunnel (TUNNEL_TOKEN) for a stable one.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8080"]
    depends_on:
      - api

  # Unit + integration tests against the postgres service.
  test:
    profiles: ["test"]
    image: node:22-alpine
    working_dir: /src
    # The host's node_modules (possibly Windows builds) are masked by container-only volumes.
    volumes:
      - ..:/src
      - test_node_modules:/src/node_modules
      - /src/packages/shared/node_modules
      - /src/apps/server/node_modules
      - /src/apps/gateway/node_modules
    environment:
      SMSAI_TEST_DATABASE_URL: postgres://smsai:smsai_dev_password@postgres:5432/postgres?sslmode=disable
    command: ["sh", "-c", "corepack enable && pnpm config set store-dir /root/.pnpm-store && pnpm install --frozen-lockfile --filter '@smsai/server...' && pnpm --filter @smsai/shared --filter @smsai/server test"]
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9099:9090"
    depends_on:
      - api

volumes:
  pgdata:
  test_node_modules:
