# Single-VM pilot stack (plan §12.2 phase P1). See docs/DEPLOYMENT.md.
#
# Every command needs the operator's env file. scripts/prod-compose.sh adds it:
#   scripts/prod-compose.sh up -d --build
# which is the same as
#   docker compose -f deployments/compose.prod.yaml --env-file deployments/.env.prod up -d --build
# SMSAI_ENV_FILE=/path/to/file selects another env file (dry runs).
#
# Only Caddy publishes ports (80/443). Postgres, the API, the worker and the
# monitoring stack are reachable only on the internal networks. Postgres,
# Prometheus and Grafana have no internet egress.
name: smsai-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging: *logging

x-app-env-file: &app-env-file
  - path: ${SMSAI_ENV_FILE:-.env.prod}
    required: true

# These override the env file. APP_ENV defaults to production, where
# validate() refuses mock providers, insecure keys and missing tokens.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  HTTP_ADDR: ":8080"
  DATABASE_URL: postgres://smsai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@postgres:5432/smsai?sslmode=disable
  AUTO_MIGRATE: "false"
  EMBEDDED_WORKER: "false"

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smsai
      POSTGRES_DB: smsai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsai -d smsai"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Applies migrations, then exits. api and worker start only after it succeeds.
  migrate:
    <<: *hardening
    image: smsai-ghana:${SMSAI_IMAGE_TAG:-pilot}
    pull_policy: never
    command: ["node", "dist/admin.js", "migrate"]
    env_file: *app-env-file
    environment: *app-env
    networks: [backend]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    image: smsai-ghana:${SMSAI_IMAGE_TAG:-pilot}
    command: ["node", "--enable-source-maps", "dist/api.js"]
    restart: unless-stopped
    env_file: *app-env-file
    environment: *app-env
    # public: Caddy reaches the API here (including the phone gateway), and the API calls DeepInfra.
    networks: [public, backend]
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *hardening
    image: smsai-ghana:${SMSAI_IMAGE_TAG:-pilot}
    pull_policy: never
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    restart: unless-stopped
    env_file: *app-env-file
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9091"
    networks: [public, backend]
    # In-flight jobs finish within their lease (JOB_LEASE_SECONDS, default 60).
    stop_grace_period: 70s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    <<: *hardening
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # IPv4 only: with IPv6, Docker's userland proxy would hide client
    # addresses and defeat OPS_ALLOWED_CIDRS.
    ports:
      - "${PUBLIC_BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the env file}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in the env file}
      OPS_ALLOWED_CIDRS: ${OPS_ALLOWED_CIDRS:?set OPS_ALLOWED_CIDRS in the env file}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public, ops]
    depends_on: [api, grafana]

  # Nightly pg_dump with retention; see deployments/backup/backup.sh.
  backup:
    <<: *hardening
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: smsai
      PGDATABASE: smsai
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backup:/opt/backup:ro
      - ${BACKUP_DIR:-/var/backups/smsai}:/backups
      - backup_metrics:/textfile
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    # Prometheus cannot read environment variables, so the token goes to a
    # file inside the container for `credentials_file`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION_TIME} \
          --storage.tsdb.retention.size=$${PROMETHEUS_RETENTION_SIZE} \
          --web.external-url=$${PROMETHEUS_EXTERNAL_URL}
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in the env file}
      PROMETHEUS_RETENTION_TIME: ${PROMETHEUS_RETENTION_TIME:-30d}
      PROMETHEUS_RETENTION_SIZE: ${PROMETHEUS_RETENTION_SIZE:-4GB}
      PROMETHEUS_EXTERNAL_URL: http://prometheus:9090/
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [backend]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf '%s' "$$ALERT_SLACK_WEBHOOK_URL" > /tmp/slack_webhook_url
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.external-url=$${ALERTMANAGER_EXTERNAL_URL} \
          --web.route-prefix=/
    environment:
      # Slack-compatible incoming webhook (Slack, Mattermost, Rocket.Chat,
      # Discord with /slack appended). docs/DEPLOYMENT.md shows alternatives.
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:?set ALERT_SLACK_WEBHOOK_URL in the env file}
      # Link target in notifications. The API stays at / (--web.route-prefix).
      ALERTMANAGER_EXTERNAL_URL: ${GRAFANA_ROOT_URL:-https://${DOMAIN}/grafana/}alerting/list
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    # public: notifications leave the VM.
    networks: [backend, public]

  grafana:
    <<: *hardening
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Only applied when Grafana first creates its database (see RUNBOOKS.md to change it later).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the env file}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${DOMAIN}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # No calls home: Grafana has no internet egress anyway.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [backend, ops]
    depends_on: [prometheus]

  # Host disk/memory/CPU, plus the backup and restore-drill timestamps that
  # the backup container writes to the shared textfile directory.
  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro
      - backup_metrics:/textfile:ro
    networks: [backend]

networks:
  # Egress and the published ports.
  public: {}
  # Postgres, metrics and alerting. No route to the internet.
  backend:
    internal: true
  # Caddy to Grafana only.
  ops:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  backup_metrics:
