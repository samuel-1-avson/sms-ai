# Prometheus for the pilot stack (deployments/compose.prod.yaml). Every
# target is on the internal `backend` network; nothing is scraped over the
# internet. The api and the worker each have their own registry: webhooks
# and USSD fast-path answers are counted in the api, and jobs, SMS dispatch,
# async answers and the daily spend gauge in the worker.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: smsai-pilot

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: smsai-api
    metrics_path: /metrics
    authorization:
      # Written from METRICS_TOKEN when the container starts.
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:8080"]

  - job_name: smsai-worker
    metrics_path: /metrics
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["worker:9091"]

  # Host disk, memory and CPU, plus backup and restore-drill timestamps.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
