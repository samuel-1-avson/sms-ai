# Alertmanager for the pilot stack. The receiver posts to a Slack-compatible
# incoming webhook. compose.prod.yaml writes ALERT_SLACK_WEBHOOK_URL to
# /tmp/slack_webhook_url when the container starts. To use email or Telegram
# instead, replace slack_configs (see docs/DEPLOYMENT.md, "Alert notifications").
route:
  receiver: operator
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: operator
      repeat_interval: 1h
    - matchers: ['severity="info"']
      receiver: operator
      repeat_interval: 24h

inhibit_rules:
  # At the cap, the 80% warning is noise.
  - source_matchers: ['alertname="DailySpendCapReached"']
    target_matchers: ['alertname="DailySpendAbove80Percent"']
  - source_matchers: ['alertname="DiskSpaceCritical"']
    target_matchers: ['alertname="DiskSpaceLow"']
    equal: [device]

receivers:
  - name: operator
    slack_configs:
      - api_url_file: /tmp/slack_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[{{ .CommonLabels.severity | toUpper }}]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}• {{ .Annotations.summary }}
          {{ with .Annotations.description }}{{ . }}
          {{ end }}{{ with .Annotations.runbook }}Runbook: {{ . }}
          {{ end }}{{ end }}
