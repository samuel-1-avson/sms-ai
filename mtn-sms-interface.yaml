        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              title: OutboundSMSMessageRequest
              required:
              - clientCorrelator
              - message
              - senderAddress
              type: object
              properties:
                senderAddress:
                  type: string
                cpAddress:
                  type: string
                receiverAddress:
                  type: array
                  items:
                    type: string
                message:
                  type: string
                clientCorrelator:
                  type: string
        required: true
