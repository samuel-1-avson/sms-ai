openapi: 3.0.1
info:
  title: Messaging SMS
  description: "Messaging SMS : Allows 3PPs to consume MTN's SMS services. MTN Messaging\
    \ SMS API allowing developers to include SMS messaging in their applications.\
    \ Provides a RESTful API to expose SMS capability"
  license:
    name: MADAPI
    url: https://developers.mtn.com/
  version: 3.0.0 - Last updated date:2026-09-23 16:48:03
servers:
- url: https://api.mtn.com/v1
  description: Production Server
security:
- OAuth2: []
tags:
- name: Messaging SMS
