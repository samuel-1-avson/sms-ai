                    type: string
                  statusMessage:
                    type: string
                  transactionId:
                    type: string
                  data:
                    title: OutboundData
                    type: object
                    properties:
                      requestId:
                        type: string
                      clientCorrelator:
                        type: string
                      planId:
                        type: string
                      serviceId:
                        type: string
                      serviceType:
                        type: string
                      isChargeable:
                        type: string
                      verificationFlagValue:
                        type: string
                      receiverAddress:
