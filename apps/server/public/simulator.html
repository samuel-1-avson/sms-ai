<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS AI Ghana Simulator</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1d1b16; --muted: #6b665c; --line: #e2ddd2;
    --accent: #0f6b4f; --accent-ink: #ffffff; --bubble-in: #0f6b4f; --bubble-out: #ece8df;
    --warn: #a3470f; --chip: #f1ede4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15140f; --panel: #1f1d17; --ink: #ece8df; --muted: #a39e92; --line: #34312a;
      --accent: #3fae86; --accent-ink: #0d1a14; --bubble-in: #2c7a5e; --bubble-out: #2b2922;
      --warn: #e08a52; --chip: #2a2821;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 20px 6px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: baseline; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 20px 14px; }
  label { font-size: 13px; color: var(--muted); }
  input[type=text] { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 0 20px 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 520px; overflow: hidden; }
  .card h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .card h2 span { color: var(--muted); font-weight: 400; }
  .thread { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 11px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.in { align-self: flex-end; background: var(--bubble-in); color: #fff; border-bottom-right-radius: 4px; }
  .msg.out { align-self: flex-start; background: var(--bubble-out); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .msg.in .meta { color: rgba(255,255,255,.75); }
  .compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  .compose input { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 0; }
  .chip { font-size: 12px; padding: 4px 9px; background: var(--chip); border-radius: 999px; border: 1px solid var(--line); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 12px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; padding: 0 14px 12px; }
  .err { color: var(--warn); font-size: 13px; padding: 0 20px; min-height: 18px; }
  @media (max-width: 520px) { header, .bar, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>SMS AI Ghana · Simulator</h1>
  <span class="sub" id="envline">Loading…</span>
</header>
<div class="bar">
  <label for="phone">Phone</label>
  <input type="text" id="phone" value="0244123456" size="16" aria-label="Simulated phone number">
  <label for="token">Admin token</label>
  <input type="text" id="token" placeholder="only if ADMIN_API_TOKEN is set" size="22">
</div>
<div class="err" id="err" role="alert"></div>
<main>
  <section class="card" aria-label="Two-way SMS">
    <h2>Two-way SMS <span>mock gateway</span></h2>
    <div class="thread" id="thread"></div>
    <div class="chips" id="smsChips"></div>
    <form class="compose" id="smsForm">
      <input type="text" id="smsInput" placeholder="Text a question…" autocomplete="off" aria-label="SMS text">
      <button class="primary" type="submit">Send</button>
    </form>
  </section>

  <section class="card" aria-label="Today">
    <h2>Today <span id="day"></span></h2>
    <div class="stats" id="stats"></div>
    <p class="note">Counts only. The admin API never returns message content.</p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const sent = [];          // inbound texts typed here: {body, at}

function headers() {
  const h = { "Content-Type": "application/json" };
  const t = $("token").value.trim();
  if (t) h["Authorization"] = "Bearer " + t;
  return h;
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: headers(), body: JSON.stringify(body) } : { headers: headers() });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  $("err").textContent = "";
  return data;
}

function showError(e) { $("err").textContent = e.message || String(e); }

async function sendSMS(text) {
  text = text.trim();
  if (!text) return;
  sent.push({ body: text, at: new Date() });
  render();
  try { await api("/admin/simulate/channel", { channel: "sms", from: $("phone").value, body: text }); }
  catch (e) { showError(e); }
}

let outbox = [];
async function refreshOutbox() {
  try {
    const d = await api("/admin/simulate/outbox?phone=" + encodeURIComponent($("phone").value));
    outbox = (d.messages || []).reverse();
    render();
  } catch (e) { /* keep polling quietly */ }
}

function render() {
  const items = [
    ...sent.map((m) => ({ dir: "in", body: m.body, at: m.at })),
    ...outbox.map((m) => ({ dir: "out", body: m.body, at: new Date(m.created_at), m })),
  ].sort((a, b) => a.at - b.at);
  const thread = $("thread");
  const atBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 40;
  thread.replaceChildren(...items.map((it) => {
    const div = document.createElement("div");
    div.className = "msg " + it.dir;
    div.textContent = it.body;
    const meta = document.createElement("div");
    meta.className = "meta";
    if (it.m) {
      meta.textContent = `${it.m.kind} · ${it.m.segments} seg ${it.m.encoding} · ${it.m.answer_source || "-"} · ${it.m.status}`;
    } else {
      meta.textContent = it.at.toLocaleTimeString();
    }
    div.appendChild(meta);
    return div;
  }));
  if (atBottom) thread.scrollTop = thread.scrollHeight;
}

$("smsForm").onsubmit = (e) => { e.preventDefault(); const v = $("smsInput").value; $("smsInput").value = ""; sendSMS(v); };
$("phone").onchange = () => { sent.length = 0; outbox = []; render(); refreshOutbox(); };

const smsChips = [
  ["Photosynthesis?", "What is photosynthesis?"],
  ["Follow-up", "Why do they need sunlight?"],
  ["NHIS (grounded)", "How do I check my NHIS renewal?"],
  ["Long answer", "Give me a long explanation of rainfall"],
  ["MORE", "MORE"], ["HELP", "HELP"], ["NEW", "NEW"], ["CODE STEMGH", "CODE STEMGH"],
];
for (const [label, text] of smsChips) {
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = label;
  b.onclick = () => sendSMS(text); $("smsChips").appendChild(b);
}
const split = document.createElement("button"); split.type = "button"; split.className = "chip"; split.textContent = "2-part split (coalesce)";
split.onclick = async () => { await sendSMS("Solve 2x + 5 = 15"); setTimeout(() => sendSMS("and explain each step"), 1000); };
$("smsChips").appendChild(split);

function stat(label, value) {
  const d = document.createElement("div"); d.className = "stat";
  const b = document.createElement("b"); b.textContent = value;
  const s = document.createElement("small"); s.textContent = label;
  d.append(b, s); return d;
}

async function refreshStats() {
  try {
    const u = await api("/admin/usage");
    $("day").textContent = u.day;
    $("stats").replaceChildren(
      stat("questions", u.questions),
      stat("coalesced texts", u.coalesced_messages),
      stat("grounded (0 tokens)", u.grounding_direct_answers),
      stat("AI calls", u.ai_calls),
      stat("empty AI replies", u.ai_empty_responses),
      stat("MORE served", u.more_served),
      stat("SMS segments", `${u.sms_segments_booked}/${u.sms_segment_cap}`),
      stat("spend (USD)", `$${u.total_spend_usd.toFixed(4)}`),
    );
  } catch (e) { /* ignore */ }
}

async function init() {
  try {
    const s = await api("/admin/status");
    $("envline").textContent = `${s.env} · model ${s.llm_provider === "mock" ? "mock (set LLM_PROVIDER=deepinfra)" : s.llm_model} · ${s.grounding_snippets} grounding snippets · breaker ${s.ai_breaker}`;
  } catch (e) { showError(e); }
  refreshOutbox(); refreshStats();
  setInterval(refreshOutbox, 1200);
  setInterval(refreshStats, 3000);
}
init();
</script>
</body>
</html>
