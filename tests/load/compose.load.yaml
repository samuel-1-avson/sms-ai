# Overlay for load runs: lifts the dev stack's daily SMS segment and spend
# caps (500 segments / $15 by default), which a load run would hit within
# minutes, and pins the mock model so a run never makes paid LLM calls,
# whatever ../.env says. Everything else stays as in
# deployments/compose.yaml. From the repository root:
#   docker compose -f deployments/compose.yaml -f tests/load/compose.load.yaml up -d --build
# Bring the stack back up without this file afterwards to restore .env.
services:
  api:
    environment: &load-env
      GLOBAL_DAILY_SMS_SEGMENT_CAP: "10000000"
      GLOBAL_DAILY_SPEND_CAP_USD: "1000000"
      LLM_PROVIDER: mock
  worker:
    environment: *load-env
